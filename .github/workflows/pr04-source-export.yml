name: PR-04 apply implementation

on:
  push:
    branches:
      - feat/rework-v2-pr04-execution-model
    paths:
      - .github/workflows/pr04-source-export.yml
      - .pr04-patch/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PR-04 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/pr04-source-export.yml <<'OLD_WORKFLOW'
          name: PR-04 source export

          on:
            push:
              branches:
                - feat/rework-v2-pr04-execution-model
              paths:
                - .github/workflows/pr04-source-export.yml
            pull_request:
              branches:
                - main
              paths:
                - .github/workflows/pr04-source-export.yml

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/upload-artifact@v4
                  with:
                    name: pr04-source
                    retention-days: 1
                    if-no-files-found: error
                    path: |
                      apps/api/src/rework
                      apps/api/src/access
                      apps/api/src/platform/migration-manifest.json
                      apps/api/migrations
                      apps/web/src
                      packages/contracts/src
                      tests/unit
                      tests/integration/rework-v2-process-worker-preassignment-postgres.test.ts
                      tests/integration/full-business-chain-postgres.test.ts
          OLD_WORKFLOW
          cat .pr04-patch/part* | base64 -d | xz -d > /tmp/pr04.patch
          patch -p1 < /tmp/pr04.patch
          rm -rf .pr04-patch
          git config user.name "dx-rework-pr04-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --name-only -z | xargs -0 git add --
          git diff --cached --check
          git commit -m "feat: unify rework execution and retire standalone tail inspection"
          git push origin HEAD:feat/rework-v2-pr04-execution-model
