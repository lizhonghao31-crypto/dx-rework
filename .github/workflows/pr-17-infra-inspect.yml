name: PR-17 read-only infrastructure inspection

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact current main SHA to authorize inspection tooling
        required: true
        type: string
      target_environment:
        description: Protected pilot environment
        required: true
        type: choice
        options:
          - dx-rework-pilot
      server_name:
        description: Confirmed shared staging server name
        required: true
        type: choice
        options:
          - staging-api.dxerp.org.cn

permissions:
  contents: read

concurrency:
  group: pr-17-infra-inspect-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect dx-rework pilot host read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0

      - name: Authorize exact current main and inspection scope
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.git_sha }}
          SERVER_NAME: ${{ inputs.server_name }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SERVER_NAME" = staging-api.dxerp.org.cn
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          bash -n scripts/deploy/inspect-shared-host.sh

      - name: Inspect pilot host without mutation
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DX_REWORK_SSH_HOST }}
          SSH_USER: ${{ secrets.DX_REWORK_SSH_USER }}
          SSH_KEY: ${{ secrets.DX_REWORK_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DX_REWORK_SSH_HOST_KEY }}
          SERVER_NAME: ${{ inputs.server_name }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_HOST_KEY"
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]
          test "$SERVER_NAME" = staging-api.dxerp.org.cn

          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'bash -s --' "$SERVER_NAME" \
            < scripts/deploy/inspect-shared-host.sh \
            | tee pr17-infra-inspection.txt

      - name: Upload sanitized inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr17-infra-inspection-${{ inputs.git_sha }}
          path: pr17-infra-inspection.txt
          if-no-files-found: error
          retention-days: 7
