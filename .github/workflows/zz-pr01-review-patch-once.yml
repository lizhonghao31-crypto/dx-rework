          PATCH
          sed -i 's/^          //' /tmp/pr01-review.patch
          git apply --check /tmp/pr01-review.patch
          git apply /tmp/pr01-review.patch
          rm -f .github/workflows/zz-pr01-review-patch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/rework/rework-business-detail-service.ts apps/api/src/rework/service.ts apps/web/src/rework-v2-form.tsx tests/integration/receiving-postgres.test.ts tests/unit/n01-local-draft-contract.test.ts tests/unit/rework-business-detail-attachment-authorization.test.ts tests/unit/v1-prelaunch-receiving-batch-propagation.test.ts .github/workflows/zz-pr01-review-patch-once.yml
          git diff --cached --check
