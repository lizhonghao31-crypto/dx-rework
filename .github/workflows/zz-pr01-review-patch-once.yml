          +    expect(stored.rows[0]).toEqual({
          +      source_receiving_batch_id: receipt.value.receivingBatchId,
          +      audited_receiving_batch_id: receipt.value.receivingBatchId,
          +    });
          +  });
          +
             it("searches known style numbers without forcing a second manual spelling", async () => {
               const options = await service.listStyleOptions("RECEIVING");
               expect(options).toContain("STYLE-RECEIVING-01");
          diff --git a/tests/unit/n01-local-draft-contract.test.ts b/tests/unit/n01-local-draft-contract.test.ts
          index cfefdef..ed14955 100644
          --- a/tests/unit/n01-local-draft-contract.test.ts
          +++ b/tests/unit/n01-local-draft-contract.test.ts
          @@ -32,6 +32,7 @@ describe("N01 local-only draft contract", () => {
               expect(source).toContain("localDraftSeed?.images.map(restoredImage) ?? []");
               expect(source).toContain("tools/attachments/${image.attachmentId}/download?mode=preview");
               expect(source).toContain("已恢复本机保存资料；尚未创建返工单");
          +    expect(source).toContain("initialReceivingBatchId() ?? localDraftSeed?.receivingBatchId ?? undefined");
             });
          
             it("creates the server rework order only from the real submit path and clears the local copy after success", async () => {
          diff --git a/tests/unit/rework-business-detail-attachment-authorization.test.ts b/tests/unit/rework-business-detail-attachment-authorization.test.ts
          new file mode 100644
          index 0000000..b19a092
          --- /dev/null
          +++ b/tests/unit/rework-business-detail-attachment-authorization.test.ts
          @@ -0,0 +1,39 @@
          +import { randomUUID } from "node:crypto";
          +
          +import type { Pool } from "pg";
          +import { describe, expect, it, vi } from "vitest";
          +
          +import { ApplicationError } from "../../apps/api/src/platform/errors.js";
          +import { ReworkBusinessDetailService } from "../../apps/api/src/rework/rework-business-detail-service.js";
          +import type { TrustedActorContext } from "../../apps/api/src/tools/repositories.js";
          +
          +const actor: TrustedActorContext = {
          +  actorId: randomUUID(),
          +  actorRoles: ["quality_control"],
          +  authorizationCapability: "rework:view",
          +  authorizationCapabilities: ["rework:view"],
