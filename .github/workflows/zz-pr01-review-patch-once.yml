name: PR-01 patch bridge

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  apply-reviewed-patch:
    if: github.head_ref == 'automation/pr01-review-patch-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed patch, verify, and push PR-01 branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/lizhonghao31-crypto/dx-rework/issues/comments/5387765162 --jq .body > /tmp/comment.md
          python - <<'PY'
          from pathlib import Path
          import re
          body = Path('/tmp/comment.md').read_text()
          m = re.search(r"```(?:diff|patch)\n(.*?)```", body, re.S)
          if not m:
              raise SystemExit('unified diff fence not found')
          Path('/tmp/pr01.patch').write_text(m.group(1))
          PY
          git apply --check /tmp/pr01.patch
          git apply /tmp/pr01.patch
          rm -f .github/workflows/zz-pr01-review-patch-once.yml
          git diff --check
          npm ci
          npm run build:packages
          npx vitest run tests/unit/n01-local-draft-contract.test.ts tests/unit/v1-prelaunch-receiving-batch-propagation.test.ts tests/unit/rework-business-detail-attachment-authorization.test.ts
          npx vitest run tests/integration/receiving-postgres.test.ts tests/integration/rework-postgres.test.ts tests/integration/rework-v2-n01-postgres.test.ts
          npm run lint
          npm run typecheck
          npm run build
          npm run db:migrate:lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close receiving batch review gaps"
          git push origin HEAD:feat/v1-receiving-rework-link
