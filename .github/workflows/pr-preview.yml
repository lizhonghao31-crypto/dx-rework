name: PR preview artifact and optional deployment

on:
  workflow_dispatch:

permissions:
  contents: read

# Automatic PR preview is intentionally disabled. Current UAT uses the ECS/staging
# deployment path; preview may be rebuilt later only behind an explicit manual trigger.
jobs:
  preview-disabled:
    name: Manual preview placeholder
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automatic PR preview is disabled by GitHub Actions usage policy."
