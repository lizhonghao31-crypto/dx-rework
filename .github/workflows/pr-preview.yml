name: PR preview artifact and optional deployment

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to render
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: manual-visual-preview-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  production-command-center-visual:
    name: Render production command center visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Pin npm 10
        run: npm install --global npm@10.9.9 --no-audit --no-fund --prefer-offline

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build real-component visual fixture
        run: node scripts/production-command-center-preview.mjs "$RUNNER_TEMP/production-command-center-preview"

      - name: Install pinned Chromium runner
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Serve preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/production-command-center-preview"             >"$RUNNER_TEMP/production-command-center-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/production-command-center-http.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/production-command-center-http.log" >&2
          exit 1

      - name: Capture desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-command-center-captures"
          npx --yes playwright@1.55.0 screenshot             --browser=chromium             --viewport-size="1536,960"             --full-page             --wait-for-timeout=800             http://127.0.0.1:4173/             "$RUNNER_TEMP/production-command-center-captures/desktop-1536x960.png"
          npx --yes playwright@1.55.0 screenshot             --browser=chromium             --viewport-size="390,844"             --full-page             --wait-for-timeout=800             http://127.0.0.1:4173/             "$RUNNER_TEMP/production-command-center-captures/mobile-390x844.png"

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-command-center-visual-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-command-center-preview
            ${{ runner.temp }}/production-command-center-captures
          if-no-files-found: error
          retention-days: 14
