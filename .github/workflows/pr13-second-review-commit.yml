name: PR-13 second review commit

on:
  push:
    branches: [pr13-final-staging]

permissions:
  contents: write

jobs:
  apply-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f667b409f672606a8a6b878f3cd0219e04931419
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Apply exact second-review patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr13.patch.b64 <<'PATCH'

PATCH
          base64 --decode /tmp/pr13.patch.b64 > /tmp/pr13.patch
          git apply --index /tmp/pr13.patch
          git diff --cached --check
      - name: Validate focused repair
        run: |
          npm ci
          npm run typecheck
          npm run db:migrate:lint
          npx vitest run tests/unit/todo-second-review-closure.test.ts
      - name: Commit and push clean repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(pr-13): close second permission review findings"
          git push origin HEAD:refs/heads/codex/pr-13-todo-notification
