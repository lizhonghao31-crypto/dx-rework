name: Technical foundation CI

on:
  pull_request:
    branches:
      - main
      - release/digital-production-v1
      - feat/digital-production-a4
      - unified-p*
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.event.pull_request.title, '[FULL]') }}
    name: Lint, test, migrate and build exact Head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Require explicit Quick Gate title
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          [[ "$PR_TITLE" == "[QUICK] "* ]] || {
            echo "PR title must start with [QUICK] or [FULL]."
            exit 1
          }

      - name: Checkout exact PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable evidence and governance files
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"
          required_files=(
            "README.md"
            "AGENTS.md"
            "docs/requirements/startup-requirements-v1.2.md"
            "docs/architecture/target-architecture-v0.1.md"
            "docs/ui/figma-pilot-baseline.md"
            ".github/pull_request_template.md"
          )
          for path in "${required_files[@]}"; do test -f "${path}"; done
          printf 'repository=%s\nhead_sha=%s\n' "${GITHUB_REPOSITORY}" "${actual_sha}"

      - name: Classify Quick Gate scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          governance_only=false
          web_only=false
          has_web_source=false

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test -n "${BASE_SHA}"
            test -n "${HEAD_SHA}"
            test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"

            git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/quick-gate-changed-files.txt"
            mapfile -t changed_files < "$RUNNER_TEMP/quick-gate-changed-files.txt"
            node scripts/ci/full-gate-risk-map.mjs --require-quick-safe "$RUNNER_TEMP/quick-gate-changed-files.txt"
            if (( ${#changed_files[@]} > 0 )); then
              governance_only=true
              web_only=true
              for path in "${changed_files[@]}"; do
                case "${path}" in
                  .github/workflows/*|.github/pull_request_template.md|AGENTS.md|docs/governance/*|docs/roadmap/*|scripts/ci/*)
                    ;;
                  *)
                    governance_only=false
                    ;;
                esac
                case "${path}" in
                  apps/web/*|packages/ui/*)
                    has_web_source=true
                    ;;
                  tests/unit/*)
                    ;;
                  *)
                    web_only=false
                    ;;
                esac
              done
              if [[ "${has_web_source}" != "true" ]]; then
                web_only=false
              fi
            fi
          fi

          echo "governance_only=${governance_only}" >> "${GITHUB_OUTPUT}"
          echo "web_only=${web_only}" >> "${GITHUB_OUTPUT}"
          echo "GOVERNANCE_ONLY=${governance_only}" >> "${GITHUB_ENV}"
          echo "WEB_ONLY=${web_only}" >> "${GITHUB_ENV}"
          echo "Quick Gate governance-only: ${governance_only}"
          echo "Quick Gate web-only: ${web_only}"

      - name: Verify Actions usage policy
        run: node scripts/ci/verify-actions-policy.mjs

      - name: Verify changed governance script syntax
        if: ${{ steps.classify.outputs.governance_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "${path}" in
              scripts/ci/*.mjs) node --check "${path}" ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")

      - name: Set up Node 22
        if: ${{ steps.classify.outputs.governance_only != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Pin npm 10
        if: ${{ steps.classify.outputs.governance_only != 'true' }}
        run: npm install --global npm@10.9.9 --no-audit --no-fund --prefer-offline

      - name: Install locked dependencies
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Lint
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run typecheck

      - name: Build workspaces without root postbuild business-chain gate
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run build --workspaces --if-present

      - name: Validate migration files statically
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run db:migrate:lint

      - name: Scan repository for committed secret signatures
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run secret:scan

      - name: Install web locked dependencies
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm ci --include-workspace-root --workspace @dx-rework/web --workspace @dx-rework/contracts --workspace @dx-rework/domain --workspace @dx-rework/ui --no-audit --no-fund --prefer-offline

      - name: Lint changed web files
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t lint_files < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^(apps/web|packages/ui|tests/unit)/.*\.(js|jsx|ts|tsx)$' || true)
          if (( ${#lint_files[@]} > 0 )); then
            npx eslint --max-warnings=0 "${lint_files[@]}"
          fi

      - name: Typecheck web workspaces
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm run typecheck --workspace @dx-rework/contracts --workspace @dx-rework/domain --workspace @dx-rework/ui --workspace @dx-rework/web --if-present

      - name: Build web workspaces
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm run build --workspace @dx-rework/contracts --workspace @dx-rework/domain --workspace @dx-rework/ui --workspace @dx-rework/web --if-present

      - name: Run changed web unit tests
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_tests < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^tests/unit/.*\.test\.(js|jsx|ts|tsx)$' || true)
          if (( ${#changed_tests[@]} > 0 )); then
            npx vitest run "${changed_tests[@]}"
          fi

      - name: Scan web-only changes for committed secret signatures
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm run secret:scan

      - name: Write web-only quick-gate summary
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        shell: bash
        run: |
          {
            echo "## Web Quick Gate"
            echo
            echo "- Head SHA: $(git rev-parse HEAD)"
            echo "- Exact Head / Actions policy: passed"
            echo "- Scoped dependency install: web + contracts + UI"
            echo "- Changed-file lint / web typecheck / web build: passed"
            echo "- Changed web unit tests / secret scan: passed"
            echo "- API, migration and full business-chain checks skipped: web-only diff"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write governance-only quick-gate summary
        if: ${{ steps.classify.outputs.governance_only == 'true' }}
        shell: bash
        run: |
          {
            echo "## Quick Gate"
            echo
            echo "- Head SHA: $(git rev-parse HEAD)"
            echo "- Exact Head / governance: passed"
            echo "- Actions policy: passed"
            echo "- Governance script syntax: passed"
            echo "- Business checks skipped: governance-only change"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write business quick-gate summary
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        shell: bash
        run: |
          {
            echo "## Quick Gate"
            echo
            echo "- Head SHA: $(git rev-parse HEAD)"
            echo "- Exact Head / governance: passed"
            echo "- Actions policy: passed"
            echo "- Lint / typecheck / workspace build: passed"
            echo "- Migration lint / secret scan: passed"
            echo "- Heavy DB, full test, release and preview work intentionally deferred to Full Gate"
          } >> "${GITHUB_STEP_SUMMARY}"
