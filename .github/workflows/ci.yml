name: Technical foundation CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Keep the historical check name to avoid breaking any existing required-check configuration.
    name: Lint, test, migrate and build exact Head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable evidence and governance files
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"
          required_files=(
            "README.md"
            "AGENTS.md"
            "docs/requirements/startup-requirements-v1.2.md"
            "docs/architecture/target-architecture-v0.1.md"
            "docs/ui/figma-pilot-baseline.md"
            ".github/pull_request_template.md"
          )
          for path in "${required_files[@]}"; do test -f "${path}"; done
          printf 'repository=%s\nhead_sha=%s\n' "${GITHUB_REPOSITORY}" "${actual_sha}"

      - name: Classify Quick Gate scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          governance_only=false
          ui_only=false

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test -n "${BASE_SHA}"
            test -n "${HEAD_SHA}"
            test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"

            mapfile -t changed_files < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
            printf '%s\n' "${changed_files[@]}" > "$RUNNER_TEMP/ui-quick-gate-files.txt"
            if (( ${#changed_files[@]} > 0 )); then
              governance_candidate=true
              ui_candidate=true
              ui_source_seen=false
              ui_contract_test_seen=false
              for path in "${changed_files[@]}"; do
                case "${path}" in
                  .github/workflows/*|.github/pull_request_template.md|AGENTS.md|docs/governance/*|scripts/ci/*)
                    ;;
                  *)
                    governance_candidate=false
                    ;;
                esac
                case "${path}" in
                  apps/web/src/*.css|apps/web/src/*.tsx)
                    ui_source_seen=true
                    ;;
                  tests/unit/*contract.test.ts)
                    ui_contract_test_seen=true
                    ;;
                  *)
                    ui_candidate=false
                    ;;
                esac
              done
              governance_only="${governance_candidate}"
              if [[ "${ui_candidate}" == true && "${ui_source_seen}" == true && "${ui_contract_test_seen}" == true ]]; then
                ui_only=true
              fi
            fi
          fi

          {
            echo "governance_only=${governance_only}"
            echo "ui_only=${ui_only}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "GOVERNANCE_ONLY=${governance_only}"
            echo "UI_ONLY=${ui_only}"
          } >> "${GITHUB_ENV}"
          echo "Quick Gate governance-only: ${governance_only}"
          echo "Quick Gate UI-only: ${ui_only}"
      - name: Verify Actions usage policy
        run: node scripts/ci/verify-actions-policy.mjs

      - name: Verify changed governance script syntax
        if: ${{ steps.classify.outputs.governance_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "${path}" in
              scripts/ci/*.mjs) node --check "${path}" ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")

      - name: Set up Node 22
        if: ${{ steps.classify.outputs.governance_only != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Pin npm 10
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        run: npm install --global npm@10.9.9

      - name: Install scoped UI dependencies
        if: ${{ steps.classify.outputs.ui_only == 'true' }}
        run: npm ci --workspace @dx-rework/web --workspace @dx-rework/contracts --workspace @dx-rework/ui --include-workspace-root --ignore-scripts

      - name: Validate UI-only diff
        if: ${{ steps.classify.outputs.ui_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          while IFS= read -r path; do test -f "${path}"; done < "$RUNNER_TEMP/ui-quick-gate-files.txt"

      - name: Lint changed UI TypeScript
        if: ${{ steps.classify.outputs.ui_only == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lint_files < <(grep -E '\.(ts|tsx)$' "$RUNNER_TEMP/ui-quick-gate-files.txt" || true)
          test "${#lint_files[@]}" -gt 0
          npx eslint "${lint_files[@]}" --max-warnings=0

      - name: Typecheck web workspace
        if: ${{ steps.classify.outputs.ui_only == 'true' }}
        run: npm run typecheck --workspace @dx-rework/web

      - name: Build web dependency chain
        if: ${{ steps.classify.outputs.ui_only == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace @dx-rework/contracts
          npm run build --workspace @dx-rework/ui
          npm run build --workspace @dx-rework/web

      - name: Run changed UI contract tests
        if: ${{ steps.classify.outputs.ui_only == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t contract_tests < <(grep -E '^tests/unit/.*contract\.test\.ts$' "$RUNNER_TEMP/ui-quick-gate-files.txt")
          test "${#contract_tests[@]}" -gt 0
          npx vitest run "${contract_tests[@]}"
      - name: Install locked dependencies
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        run: npm ci

      - name: Lint
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        run: npm run typecheck

      - name: Build workspaces without root postbuild business-chain gate
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        run: npm run build --workspaces --if-present

      - name: Validate migration files statically
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        run: npm run db:migrate:lint

      - name: Scan repository for committed secret signatures
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        run: npm run secret:scan

      - name: Write UI-only quick-gate summary
        if: ${{ steps.classify.outputs.ui_only == 'true' }}
        shell: bash
        run: |
          {
            echo "## UI-only Quick Gate"
            echo
            echo "- Head SHA: $(git rev-parse HEAD)"
            echo "- Exact Head / Actions policy: passed"
            echo "- Changed UI lint / web typecheck / web dependency build: passed"
            echo "- Changed UI contract tests: passed"
            echo "- API, database, migration and unrelated workspace checks skipped: safe UI-only diff"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Write governance-only quick-gate summary
        if: ${{ steps.classify.outputs.governance_only == 'true' }}
        shell: bash
        run: |
          {
            echo "## Quick Gate"
            echo
            echo "- Head SHA: $(git rev-parse HEAD)"
            echo "- Exact Head / governance: passed"
            echo "- Actions policy: passed"
            echo "- Governance script syntax: passed"
            echo "- Business checks skipped: governance-only change"
            echo "- Heavy DB, full test, release and preview work intentionally deferred to Full Gate"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write business quick-gate summary
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.ui_only != 'true' }}
        shell: bash
        run: |
          {
            echo "## Quick Gate"
            echo
            echo "- Head SHA: $(git rev-parse HEAD)"
            echo "- Exact Head / governance: passed"
            echo "- Actions policy: passed"
            echo "- Lint / typecheck / workspace build: passed"
            echo "- Migration lint / secret scan: passed"
            echo "- Heavy DB, full test, release and preview work intentionally deferred to Full Gate"
          } >> "${GITHUB_STEP_SUMMARY}"
