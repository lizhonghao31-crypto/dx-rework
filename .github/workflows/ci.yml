name: Technical foundation CI

on:
  pull_request:
    branches:
      - main
      - release/digital-production-v1
      - feat/digital-production-a4
      - unified-p*
      - deliver/sla-foundation-development-budget-20261024
      - deliver/sla-preparation-cutting-dispatch-20261024
    types:
      - opened
  workflow_dispatch:
  create:

permissions:
  contents: read

jobs:
  request:
    name: Resolve immutable final request
    if: ${{ github.event_name == 'create' && github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'gate/full/') || startsWith(github.event.ref, 'gate/quick/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      phase: ${{ steps.protocol.outputs.phase }}
      kind: ${{ steps.protocol.outputs.kind }}
      pr: ${{ steps.protocol.outputs.pr }}
      head: ${{ steps.protocol.outputs.head }}
      base: ${{ steps.protocol.outputs.base }}
      base_ref: ${{ steps.protocol.outputs.base_ref }}
    steps:
      - name: Checkout immutable final request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up request Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve complete request identity
        id: protocol
        run: node scripts/ci/ci-gate-runtime.mjs resolve

  validate:
    needs: request
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.action == 'opened' && github.run_attempt == 1) || github.event_name == 'workflow_dispatch' || ((github.event_name == 'create' && github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'gate/full/') || startsWith(github.event.ref, 'gate/quick/'))) && needs.request.result == 'success' && needs.request.outputs.kind == 'quick')) }}
    name: ${{ (github.event_name == 'pull_request' && github.event.action == 'opened' && github.run_attempt == 1) && 'Push light checks' || github.event_name == 'create' && 'Quick Gate exact Head' || 'Manual Quick checks' }}
    outputs:
      receipt: ${{ steps.summary.outputs.receipt }}
    concurrency:
      group: pr-gate-${{ github.event.pull_request.number || needs.request.outputs.pr || format('manual-{0}', github.ref) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_ENV: test
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SERVICE_NAME: dx-rework-api

    steps:
      - name: Require explicit Quick Gate title
        id: title
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'create' }}
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_TITLE" == "[QUICK] "* || "$PR_TITLE" == "[FULL] "* ]]
          else
            [[ "$GITHUB_REF" == refs/heads/gate/quick/* ]]
          fi

      - name: Checkout exact PR Head
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify immutable evidence and governance files
        id: head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          required_files=(
            "README.md"
            "AGENTS.md"
            "docs/requirements/startup-requirements-v1.2.md"
            "docs/architecture/target-architecture-v0.1.md"
            "docs/ui/figma-pilot-baseline.md"
            ".github/pull_request_template.md"
          )
          for path in "${required_files[@]}"; do test -f "${path}"; done
          printf 'repository=%s\nhead_sha=%s\n' "${GITHUB_REPOSITORY}" "${actual_sha}"

      - name: Set up Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate frozen request identity
        id: protocol
        run: node scripts/ci/ci-gate-runtime.mjs resolve

      - name: Classify Quick Gate scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.protocol.outputs.base }}
          HEAD_SHA: ${{ steps.protocol.outputs.head }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SELECTED_KIND: ${{ steps.protocol.outputs.kind }}
        run: |
          set -euo pipefail
          governance_only=false
          web_only=false
          has_web_source=false

          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "create" ]]; then
            test -n "${BASE_SHA}"
            test -n "${HEAD_SHA}"
            test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
            git fetch --no-tags origin "${BASE_SHA}"

            git diff --no-renames --name-only "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/quick-gate-changed-files.txt"
            mapfile -t changed_files < "$RUNNER_TEMP/quick-gate-changed-files.txt"
            if [[ "$SELECTED_KIND" == "quick" ]]; then
              node scripts/ci/full-gate-risk-map.mjs --require-quick-safe "$RUNNER_TEMP/quick-gate-changed-files.txt"
            fi
            if (( ${#changed_files[@]} > 0 )); then
              governance_only=true
              web_only=true
              for path in "${changed_files[@]}"; do
                case "${path}" in
                  .github/workflows/*|.github/pull_request_template.md|AGENTS.md|docs/governance/*|docs/roadmap/*|scripts/ci/*)
                    ;;
                  *)
                    governance_only=false
                    ;;
                esac
                case "${path}" in
                  apps/web/*|packages/ui/*)
                    has_web_source=true
                    ;;
                  tests/unit/*)
                    ;;
                  *)
                    web_only=false
                    ;;
                esac
              done
              if [[ "${has_web_source}" != "true" ]]; then
                web_only=false
              fi
            fi
          fi

          echo "governance_only=${governance_only}" >> "${GITHUB_OUTPUT}"
          echo "web_only=${web_only}" >> "${GITHUB_OUTPUT}"
          echo "GOVERNANCE_ONLY=${governance_only}" >> "${GITHUB_ENV}"
          echo "WEB_ONLY=${web_only}" >> "${GITHUB_ENV}"
          echo "Quick Gate governance-only: ${governance_only}"
          echo "Quick Gate web-only: ${web_only}"

      - name: Verify Actions usage policy
        id: policy
        run: node scripts/ci/verify-actions-policy.mjs

      - name: Verify current change evidence
        id: construction
        env:
          EVIDENCE_BASE: ${{ steps.protocol.outputs.base }}
        run: node scripts/ci/construction-evidence.mjs verify-change "$EVIDENCE_BASE"

      - name: Run CI protocol regression tests
        id: protocol_tests
        run: node --test scripts/ci/*.test.mjs

      - name: Verify changed governance script syntax
        id: governance_syntax
        if: ${{ steps.classify.outputs.governance_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ steps.protocol.outputs.base }}
          HEAD_SHA: ${{ steps.protocol.outputs.head }}
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "${path}" in
              scripts/ci/*.mjs) node --check "${path}" ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")

      - name: Pin npm 10
        id: npm
        if: ${{ steps.classify.outputs.governance_only != 'true' }}
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund --prefer-offline

      - name: Install locked dependencies
        id: install
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Lint
        id: lint
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run lint

      - name: Typecheck
        id: types
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run typecheck

      - name: Build workspaces without root postbuild business-chain gate
        id: build
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run build --workspaces --if-present

      - name: Validate migration files statically
        id: migration_lint
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run db:migrate:lint

      - name: Scan repository for committed secret signatures
        id: secrets
        if: ${{ steps.classify.outputs.governance_only != 'true' && steps.classify.outputs.web_only != 'true' }}
        run: npm run secret:scan

      - name: Install web locked dependencies
        id: web_install
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm ci --include-workspace-root --workspace @dx-rework/web --workspace @dx-rework/contracts --workspace @dx-rework/domain --workspace @dx-rework/ui --no-audit --no-fund --prefer-offline

      - name: Lint changed web files
        id: web_lint
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ steps.protocol.outputs.base }}
          HEAD_SHA: ${{ steps.protocol.outputs.head }}
        run: |
          set -euo pipefail
          mapfile -t lint_files < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^(apps/web|packages/ui|tests/unit)/.*\.(js|jsx|ts|tsx)$' || true)
          if (( ${#lint_files[@]} > 0 )); then
            npx eslint --max-warnings=0 "${lint_files[@]}"
          fi

      - name: Typecheck web workspaces
        id: web_types
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm run typecheck --workspace @dx-rework/contracts --workspace @dx-rework/domain --workspace @dx-rework/ui --workspace @dx-rework/web --if-present

      - name: Build web workspaces
        id: web_build
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm run build --workspace @dx-rework/contracts --workspace @dx-rework/domain --workspace @dx-rework/ui --workspace @dx-rework/web --if-present

      - name: Run changed web unit tests
        id: web_tests
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        shell: bash
        env:
          BASE_SHA: ${{ steps.protocol.outputs.base }}
          HEAD_SHA: ${{ steps.protocol.outputs.head }}
        run: |
          set -euo pipefail
          mapfile -t changed_tests < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" | grep -E '^tests/unit/.*\.test\.(js|jsx|ts|tsx)$' || true)
          if (( ${#changed_tests[@]} > 0 )); then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            npx vitest run "${changed_tests[@]}"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan web-only changes for committed secret signatures
        id: web_secrets
        if: ${{ steps.classify.outputs.web_only == 'true' }}
        run: npm run secret:scan


      - name: Publish source-bound light build evidence
        id: reuse_publish
        if: ${{ success() && github.event_name == 'pull_request' && steps.build.outcome == 'success' }}
        env:
          LIGHT_STEPS: ${{ toJSON(steps) }}
        run: node scripts/ci/light-reuse.mjs publish "$RUNNER_TEMP/light-build"

      - name: Save immutable light build artifact
        id: reuse_upload
        if: ${{ success() && github.event_name == 'pull_request' && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: light-build-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/light-build/light-build.json
          if-no-files-found: error
          retention-days: 3

      - name: Write actual gate summary
        id: summary
        if: always()
        shell: bash
        env:
          GATE_KIND: quick
          GATE_PHASE: ${{ steps.protocol.outputs.phase }}
          GATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_JOB_STATUS: ${{ job.status }}
          GATE_STEPS_JSON: ${{ toJSON(steps) }}
          GATE_SCOPE_JSON: >-
            {"event": "${{ github.event_name }}", "final": "${{ github.event_name == 'create' }}", "base": "${{ steps.protocol.outputs.base_ref }}", "governance": "${{ steps.classify.outputs.governance_only }}", "web": "${{ steps.classify.outputs.web_only }}", "maintenance": "false"}
          GATE_CHECKS_JSON: >-
            [["title","Require explicit Quick Gate title","pr_or_final"],["checkout","Checkout exact PR Head","always"],["head","Verify immutable evidence and governance files","always"],["node","Set up Node 22","always"],["protocol","Validate frozen request identity","always"],["classify","Classify Quick Gate scope","always"],["policy","Verify Actions usage policy","always"],["construction","Verify current change evidence","always"],["protocol_tests","Run CI protocol regression tests","always"],["governance_syntax","Verify changed governance script syntax","governance"],["npm","Pin npm 10","not_governance"],["install","Install locked dependencies","business"],["lint","Lint","business"],["types","Typecheck","business"],["build","Build workspaces without root postbuild business-chain gate","business"],["migration_lint","Validate migration files statically","business"],["secrets","Scan repository for committed secret signatures","business"],["web_install","Install web locked dependencies","web"],["web_lint","Lint changed web files","web"],["web_types","Typecheck web workspaces","web"],["web_build","Build web workspaces","web"],["web_tests","Run changed web unit tests","web"],["web_secrets","Scan web-only changes for committed secret signatures","web"],["reuse_publish","Publish source-bound light build evidence","light_build"],["reuse_upload","Save immutable light build artifact","light_build"]]
        run: |
          node <<'GATE_SUMMARY_JS'
          const fs = require('node:fs');
          const steps = JSON.parse(process.env.GATE_STEPS_JSON || '{}');
          const checks = JSON.parse(process.env.GATE_CHECKS_JSON);
          const scope = JSON.parse(process.env.GATE_SCOPE_JSON);
          const classified = steps[process.env.GATE_KIND === 'full' ? 'risk' : 'classify']?.outcome === 'success';
          const flag = name => scope[name] === 'true';
          function required(kind) {
            if (kind === 'always') return true;
            if (kind === 'pr') return scope.event === 'pull_request';
            if (kind === 'pr_or_final') return scope.event === 'pull_request' || flag('final');
            if (kind === 'release') return scope.base === 'release/digital-production-v1';
            if (!classified) return null;
            if (kind === 'release_deployment') return flag('maintenance') && scope.base === 'release/digital-production-v1';
            if (kind === 'chain') return flag('business_chain') || flag('migration') || flag('deployment');
            if (kind === 'mapped') return Boolean(scope.mapped);
            if (kind === 'governance') return flag('governance');
            if (kind === 'not_governance') return !flag('governance');
            if (kind === 'business') return !flag('governance') && !flag('web');
            if (kind === 'light_build') return scope.event === 'pull_request' && !flag('governance') && !flag('web');
            if (kind === 'optional') return false;
            if (['db','journey','migration','deployment','activation','transfer','web','maintenance'].includes(kind)) return flag(kind);
            throw new Error('Unknown gate scope: ' + kind);
          }
          const missing = [];
          const rows = checks.map(([id, label, kind]) => {
            const step = steps[id], needed = required(kind);
            const noWebTests = id === 'web_tests' && step?.outcome === 'success' && step.outputs?.has_tests === 'false';
            let status;
            if (step?.outcome === 'failure') status = '失败';
            else if (step?.outcome === 'cancelled') status = '取消';
            else if (noWebTests || needed === false && (!step || ['skipped','success'].includes(step.outcome))) status = '不适用';
            else if (step?.outcome === 'success') status = '成功';
            else if (needed === null) status = '范围未判定，未完成';
            else status = process.env.GATE_JOB_STATUS === 'cancelled' ? '取消导致未执行' : '上游中断或未执行';
            if (needed !== false && !noWebTests && step?.outcome !== 'success') missing.push(label);
            return '| ' + label + ' | ' + status + ' |';
          });
          const report = ['## ' + (['light','invalidate'].includes(process.env.GATE_PHASE) ? 'Push light checks' : process.env.GATE_KIND === 'full' ? 'Full' : 'Quick') + ' Gate 执行明细',
            '', '- Head SHA: `' + process.env.GATE_HEAD + '`', '- 摘要前 Job 状态：' + process.env.GATE_JOB_STATUS,
            '- 最终结论以 GitHub Job 为准；清理或摘要成功不代表门禁通过。', '', '| 检查 | 实际结果 |', '| --- | --- |', ...rows,
            '', '未完成必需检查（含范围未判定）：' + (missing.length ? missing.join('；') : '无'), ''].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
          if (missing.length && process.env.GATE_JOB_STATUS === 'success') process.exitCode = 1;
          GATE_SUMMARY_JS
          node scripts/ci/ci-gate-runtime.mjs emit

  affected_entries:
    name: Verify affected native entry points
    needs: request
    if: ${{ github.event_name == 'create' && github.run_attempt == 1 && needs.request.result == 'success' && needs.request.outputs.kind == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AFFECTED_PR: ${{ needs.request.outputs.pr }}
      AFFECTED_HEAD: ${{ needs.request.outputs.head }}
      AFFECTED_BASE: ${{ needs.request.outputs.base }}
      AFFECTED_BASE_REF: ${{ needs.request.outputs.base_ref }}
    steps:
      - name: Checkout pinned request source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up affected-entry Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Select affected native entries with the pinned base policy
        id: affected
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AFFECTED_HEAD"
          test "$(git rev-parse "refs/remotes/origin/$AFFECTED_BASE_REF")" = "$AFFECTED_BASE"
          verify="$RUNNER_TEMP/dx-affected-entry.mjs"
          if [[ -n "$(git ls-tree "$AFFECTED_BASE" -- scripts/ci/affected-entry-map.json)" ]]; then
            git show "$AFFECTED_BASE:scripts/ci/affected-entry-preflight.mjs" > "$verify"
          else
            # Bootstrap on branches which have not yet adopted this policy.
            cp scripts/ci/affected-entry-preflight.mjs "$verify"
          fi
          node "$verify" select
      - name: Install locked affected-entry dependencies
        if: steps.affected.outputs.required == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shared packages for original entry points
        if: steps.affected.outputs.required == 'true'
        run: npm run build:packages
      - name: Start disposable database for affected native entries
        if: steps.affected.outputs.required == 'true'
        shell: bash
        run: bash scripts/ci/start-affected-entry-postgres.sh
      - name: Prepare canonical Chromium
        if: steps.affected.outputs.required == 'true'
        run: node --input-type=module -e 'import {prepareSettingsBrowser} from "./scripts/ci/prepare-settings-browser.mjs"; prepareSettingsBrowser()'
      - name: Run and verify exact affected cases
        run: node "$RUNNER_TEMP/dx-affected-entry.mjs" verify

  full:
    permissions:
      contents: read
      actions: read
    name: Full Gate worker
    concurrency:
      group: pr-gate-${{ needs.request.outputs.pr }}
      cancel-in-progress: false
    needs: [request, affected_entries]
    if: ${{ always() && github.event_name == 'create' && github.run_attempt == 1 && needs.request.result == 'success' && needs.request.outputs.kind == 'full' && needs.affected_entries.result == 'success' }}
    uses: ./.github/workflows/full-gate.yml
    with:
      pr_number: ${{ needs.request.outputs.pr }}
      head_sha: ${{ needs.request.outputs.head }}
      base_sha: ${{ needs.request.outputs.base }}
      base_ref: ${{ needs.request.outputs.base_ref }}
      gate_kind: ${{ needs.request.outputs.kind }}

  approval:
    name: ${{ (github.event_name == 'create' && github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'gate/full/') || startsWith(github.event.ref, 'gate/quick/'))) && 'Final Gate exact Head' || 'Final approval not selected' }}
    needs: [request, validate, full]
    if: ${{ always() && (github.event_name == 'create' && github.event.ref_type == 'branch' && (startsWith(github.event.ref, 'gate/full/') || startsWith(github.event.ref, 'gate/quick/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout exact approval Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up approval Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Certify actual selected Gate result
        env:
          WORKER_RESULT: ${{ needs.request.outputs.kind == 'full' && needs.full.result || needs.validate.result }}
          WORKER_RECEIPT: ${{ needs.request.outputs.kind == 'full' && needs.full.outputs.receipt || needs.validate.outputs.receipt }}
        run: node scripts/ci/ci-gate-runtime.mjs certify
