name: Full Gate

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      base_ref:
        type: string
        required: true
      gate_kind:
        type: string
        required: true
    outputs:
      receipt:
        value: ${{ jobs.full-validate.outputs.receipt }}

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Full Gate common preparation
    if: ${{ inputs.gate_kind == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      bundle_hash: ${{ steps.bundle.outputs.bundle_hash }}
      record: ${{ steps.lane.outputs.record }}
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      NODE_ENV: test
      GIT_SHA: ${{ inputs.head_sha }}
      SERVICE_NAME: dx-rework-api
      FULL_GATE_LANE: prepare
    steps:
      - name: Require explicit Full Gate title
        id: title
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_KIND: ${{ inputs.gate_kind }}
          REQUEST_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "create" && "$REQUEST_KIND" == "full" ]]
          test "$REQUEST_HEAD" = "$GITHUB_SHA"

      - name: Checkout exact PR Head
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node 22
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm 10
        id: npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund --prefer-offline

      - name: Verify exact Head
        id: head
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Validate frozen request identity
        id: protocol
        env:
          EXPECTED_GATE_KIND: ${{ inputs.gate_kind }}
          EXPECTED_GATE_HEAD: ${{ inputs.head_sha }}
          EXPECTED_GATE_BASE: ${{ inputs.base_sha }}
          EXPECTED_GATE_PR: ${{ inputs.pr_number }}
          EXPECTED_GATE_BASE_REF: ${{ inputs.base_ref }}
        run: node scripts/ci/ci-gate-runtime.mjs resolve

      - name: Select successful same-Head light evidence
        id: reuse_select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/light-reuse.mjs select "$RUNNER_TEMP/light-reuse-source.json"

      - name: Download exact source light artifact
        id: reuse_download
        if: ${{ steps.reuse_select.outputs.artifact_id != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.reuse_select.outputs.artifact_id }}
          run-id: ${{ steps.reuse_select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/light-reuse
          merge-multiple: true

      - name: Verify source context and restore build outputs
        id: reuse_restore
        if: ${{ steps.reuse_select.outputs.artifact_id != '' }}
        run: |
          node scripts/ci/light-reuse.mjs restore "$RUNNER_TEMP/light-reuse-source.json" "$RUNNER_TEMP/light-reuse/light-build.json" "$RUNNER_TEMP/verified-light-reuse.json"
          echo "LIGHT_REUSE_STATE=$RUNNER_TEMP/verified-light-reuse.json" >> "$GITHUB_ENV"

      - name: Verify Actions usage policy
        id: policy
        run: node scripts/ci/verify-actions-policy.mjs

      - name: Verify current change evidence
        id: construction
        env:
          EVIDENCE_BASE: ${{ inputs.base_sha }}
        run: node scripts/ci/construction-evidence.mjs verify-change "$EVIDENCE_BASE"

      - name: Run CI protocol regression tests
        id: protocol_tests
        run: node scripts/test-preflight.mjs

      - name: Classify Full Gate risk from exact PR diff
        id: risk
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > "$RUNNER_TEMP/full-gate-changed-files.txt"
          node scripts/ci/full-gate-risk-map.mjs --github-env "$GITHUB_ENV" "$RUNNER_TEMP/full-gate-changed-files.txt"

      - name: Compare exact candidate with current remote main migration history
        id: main_compat
        if: inputs.base_ref == 'release/digital-production-v1'
        shell: bash
        env:
          COMPAT_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          node scripts/check-main-release-compat.mjs --intent integration --candidate-ref "$GIT_SHA" --tool-ref "$GIT_SHA" --baseline-ref "$COMPAT_BASE_SHA" --output "$RUNNER_TEMP/main-release-compat.json"

      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Record actual toolchain and resolved test configuration
        id: runtime
        run: node scripts/ci/test-runtime-metadata.mjs --config vitest.config.ts

      - name: Audit production dependency graph
        id: audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        id: lint
        run: node scripts/ci/light-reuse.mjs run lint npm run lint

      - name: Typecheck
        id: types
        run: node scripts/ci/light-reuse.mjs run types npm run typecheck

      - name: Build workspaces without deployment postbuild
        id: build
        run: node scripts/ci/light-reuse.mjs run build npm run build --workspaces --if-present

      - name: Validate migration files statically
        id: migration_lint
        run: node scripts/ci/light-reuse.mjs run migration_lint npm run db:migrate:lint

      - name: Scan repository history and first-party artifacts for secrets
        id: secrets
        run: npm run secret:scan:full

      - name: Freeze shared build and exact plans
        id: bundle
        run: node scripts/ci/full-gate-lanes.mjs bundle

      - name: Upload immutable shared inputs
        id: bundle_upload
        uses: actions/upload-artifact@v4
        with:
          name: full-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-inputs.json
          if-no-files-found: error
          retention-days: 7

      - name: Record lane outcomes
        id: lane
        if: always()
        env:
          LANE_STEPS: ${{ toJSON(steps) }}
          LANE_STATUS: ${{ job.status }}
        run: node scripts/ci/full-gate-lanes.mjs record

  non-db:
    name: Full Gate non-db
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      record: ${{ steps.lane.outputs.record }}
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      NODE_ENV: test
      GIT_SHA: ${{ inputs.head_sha }}
      SERVICE_NAME: dx-rework-api
      FULL_GATE_LANE: non-db
      FULL_GATE_BUNDLE_HASH: ${{ needs.prepare.outputs.bundle_hash }}
    steps:
      - name: Checkout isolated lane
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - name: Set up lane Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin lane npm 10
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund --prefer-offline
      - name: Install lane dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Download immutable shared inputs
        uses: actions/download-artifact@v4
        with:
          name: full-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Verify and restore shared inputs
        run: node scripts/ci/full-gate-lanes.mjs restore
      - name: Full unit and integration suite without runtime DB escalation
        id: tests
        env:
          DATABASE_URL: ''
          TEST_DATABASE_URL: ''
          ACCEPTANCE_CLOCK_TEST_DATABASE_URL: ''
        run: node node_modules/vitest/vitest.mjs run --reporter=default --reporter=json --outputFile=${{ runner.temp }}/non-db-results.json

      - name: Record lane outcomes
        id: lane
        if: always()
        env:
          LANE_STEPS: ${{ toJSON(steps) }}
          LANE_STATUS: ${{ job.status }}
        run: node scripts/ci/full-gate-lanes.mjs record
      - name: Retain original lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-evidence-non-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/non-db-results.json
            ${{ runner.temp }}/postgres-execution.json
            ${{ runner.temp }}/full-lane-record.json
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: Full Gate postgres
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      record: ${{ steps.lane.outputs.record }}
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      NODE_ENV: test
      GIT_SHA: ${{ inputs.head_sha }}
      SERVICE_NAME: dx-rework-api
      FULL_GATE_LANE: postgres
      FULL_GATE_BUNDLE_HASH: ${{ needs.prepare.outputs.bundle_hash }}
    steps:
      - name: Checkout isolated lane
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - name: Set up lane Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin lane npm 10
        run: npm install --global "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund --prefer-offline
      - name: Install lane dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Download immutable shared inputs
        uses: actions/download-artifact@v4
        with:
          name: full-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Verify and restore shared inputs
        run: node scripts/ci/full-gate-lanes.mjs restore
      - name: Start isolated PostgreSQL only for DB-sensitive changes
        id: db_start
        if: env.DB_REQUIRED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name dx-rework-full-gate-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres_ci \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 postgres:16-alpine
          ready_streak=0
          for _ in $(seq 1 60); do
            if docker exec dx-rework-full-gate-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ready_streak=$((ready_streak + 1))
              if [[ "$ready_streak" -ge 3 ]]; then break; fi
            else
              ready_streak=0
            fi
            sleep 1
          done
          if [[ "$ready_streak" -lt 3 ]]; then docker logs dx-rework-full-gate-postgres; exit 1; fi
          docker exec dx-rework-full-gate-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dx_rework_test LOGIN PASSWORD 'dx_rework_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          docker exec dx-rework-full-gate-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE dx_rework_ci OWNER dx_rework_test"
          docker exec dx-rework-full-gate-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE dx_rework_acceptance_clock_test OWNER dx_rework_test" \
            -c "COMMENT ON DATABASE dx_rework_acceptance_clock_test IS 'dx-rework-isolated-test-v1'"
          docker exec dx-rework-full-gate-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "COMMENT ON DATABASE dx_rework_ci IS 'dx-rework-isolated-test-v1'"
          docker exec dx-rework-full-gate-postgres psql -U postgres -d dx_rework_ci -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dx_rework_acceptance NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "CREATE ROLE dx_rework_acceptance_app NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "GRANT dx_rework_acceptance, dx_rework_acceptance_app TO dx_rework_test"
          test_url='postgresql://dx_rework_test:dx_rework_ci@127.0.0.1:5432/dx_rework_ci'
          NODE_ENV=test TEST_DATABASE_URL="$test_url" node scripts/test-database-safety.mjs
          { echo "DATABASE_URL=$test_url"; echo "TEST_DATABASE_URL=$test_url"; } >> "$GITHUB_ENV"
          echo 'ACCEPTANCE_CLOCK_TEST_DATABASE_URL=postgresql://dx_rework_test:dx_rework_ci@127.0.0.1:5432/dx_rework_acceptance_clock_test' >> "$GITHUB_ENV"

      - name: Seed database with base-revision migration history
        id: db_seed
        if: env.DB_REQUIRED == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: bash scripts/seed-base-migrations.sh

      - name: Apply and validate exact Head migration history against PostgreSQL
        id: db_migrate
        if: env.DB_REQUIRED == 'true'
        run: npm run db:migrate:check

      - name: Validate database resource lifecycle before expensive suites
        id: resource_smoke
        if: env.DB_REQUIRED == 'true'
        run: node scripts/test-preflight.mjs --database

      - name: Run mapped PostgreSQL sensitive-domain regressions
        id: db_tests
        if: env.DB_REQUIRED == 'true'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          DX_REWORK_POSTGRES_RECEIPT: ${{ runner.temp }}/postgres-execution.json
        run: node scripts/run-business-chain-gate.mjs --full-gate
        # Mapped PostgreSQL suite executed no passing tests is a hard error in the shared runner.

      - name: Run PostgreSQL 13 Journey read compatibility
        id: journey
        if: env.JOURNEY_PG13_COMPAT == 'true'
        run: node scripts/ci/journey-pg13-regression.mjs

      - name: Run PostgreSQL Root audit control-boundary regressions for migration changes
        id: root_audit
        if: env.MIGRATION_SENSITIVE == 'true'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          DX_REWORK_POSTGRES_RECEIPT: ${{ runner.temp }}/postgres-execution.json
        run: node scripts/run-business-chain-gate.mjs --full-gate --verify-receipt

      - name: Run PostgreSQL business chain for business, migration or deployment-sensitive changes
        id: business_chain
        if: env.BUSINESS_CHAIN_SENSITIVE == 'true' || env.MIGRATION_SENSITIVE == 'true' || env.DEPLOYMENT_SENSITIVE == 'true'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          DX_REWORK_POSTGRES_RECEIPT: ${{ runner.temp }}/postgres-execution.json
        run: node scripts/run-business-chain-gate.mjs --full-gate --verify-receipt

      - name: PostgreSQL backup and isolated restore drill
        id: backup
        if: env.MAINTENANCE_SENSITIVE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr17-db-drill"
          node_bin="$(readlink -f "$(command -v node)")"
          mkdir -p "$root/shared" "$root/backups/postgres"
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > "$root/shared/.env"
          printf 'DX_REWORK_NODE_BIN=%s\n' "$node_bin" > "$root/shared/deploy.env"
          chmod 0600 "$root/shared/.env" "$root/shared/deploy.env"
          state="$(node scripts/deploy/database-state.mjs print-current)"
          target_version="$(node -p "require('./apps/api/src/platform/migration-manifest.json').migrations.at(-1).version")"
          target_checksum="$(node -p "require('./apps/api/src/platform/migration-manifest.json').migrations.at(-1).checksum")"
          DX_REWORK_ROOT="$root" DX_REWORK_APP_ENV_FILE="$root/shared/.env" DX_REWORK_DEPLOY_ENV_FILE="$root/shared/deploy.env" \
            GIT_SHA="$(git rev-parse HEAD)" CURRENT_DATABASE_STATE="$state" TARGET_SCHEMA_VERSION="$target_version" \
            TARGET_SCHEMA_CHECKSUM="$target_checksum" scripts/backup-postgres.sh
          admin_url='postgresql://postgres:postgres_ci@127.0.0.1:5432/postgres'
          target_name='dx_rework_drill_ci'
          psql "$admin_url" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $target_name"
          psql "$admin_url" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $target_name OWNER dx_rework_test"
          target_url="postgresql://dx_rework_test:dx_rework_ci@127.0.0.1:5432/$target_name"
          source scripts/deploy/lib.sh
          target_fp="$(database_connection_fingerprint "$target_url")"
          {
            printf 'DX_REWORK_RESTORE_DATABASE_URL=%s\n' "$target_url"
            printf 'DX_REWORK_APPROVED_TARGET_FINGERPRINT=%s\n' "$target_fp"
            printf 'DX_REWORK_APPROVED_TARGET_DATABASE=%s\n' "$target_name"
          } > "$root/shared/restore.env"
          chmod 0600 "$root/shared/restore.env"
          backup_set="$(find "$root/backups/postgres" -mindepth 1 -maxdepth 1 -type d ! -name '.tmp-*' -print -quit)"
          test -n "$backup_set"
          DX_REWORK_ROOT="$root" DX_REWORK_DEPLOY_ENV_FILE="$root/shared/deploy.env" \
            DX_REWORK_RESTORE_ENV_FILE="$root/shared/restore.env" DX_REWORK_RESTORE_DRILL=true \
            DX_REWORK_RESTORE_CONFIRM=RESTORE_TO_ISOLATED_DRILL \
            DX_REWORK_RESTORE_MANIFEST="$PWD/apps/api/src/platform/migration-manifest.json" \
            scripts/restore-postgres.sh "$backup_set"
          DATABASE_URL="$target_url" node scripts/deploy/verify-database-readiness.mjs apps/api/src/platform/migration-manifest.json
          psql "$admin_url" -v ON_ERROR_STOP=1 -c "DROP DATABASE $target_name"

      - name: Acceptance low-privilege migration and backup recovery
        id: acceptance_recovery
        if: env.MAINTENANCE_SENSITIVE == 'true'
        run: |
          node scripts/ci/acceptance-maintenance-drill.mjs 13
          node scripts/ci/acceptance-maintenance-drill.mjs 15
          node scripts/ci/acceptance-maintenance-drill.mjs 16

      - name: Main and existing release histories through low-privilege Acceptance maintenance
        id: release_history
        if: inputs.base_ref == 'release/digital-production-v1' && env.MAINTENANCE_SENSITIVE == 'true'
        run: |
          node scripts/ci/main-release-history-drill.mjs 13 "$RUNNER_TEMP/main-release-compat.json"
          node scripts/ci/main-release-history-drill.mjs 16 "$RUNNER_TEMP/main-release-compat.json"

      - name: PR-17 exact-head acceptance and lifecycle
        id: release_acceptance
        if: env.ACTIVATION_SENSITIVE == 'true'
        shell: bash
        run: |
          TARGET_SHA="$(git rev-parse HEAD)" npm run pr17:acceptance
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          npx vitest run \
            tests/unit/pr-17-deployment.test.ts \
            tests/unit/pr-17-operations.test.ts \
            tests/integration/pr-17-release-lifecycle.test.ts \
            tests/integration/pr-17-deploy-failure.test.ts \
            tests/integration/pr-17-review-fixes.test.ts

      - name: PR-17 package, runtime and relocation-safe transfer
        id: package
        if: env.TRANSFER_SENSITIVE == 'true'
        shell: bash
        env:
          DX_REWORK_BUILD_ROOT: ${{ runner.temp }}/pr17-build
        run: |
          sha="$(git rev-parse HEAD)"
          out="$DX_REWORK_BUILD_ROOT/$sha"
          mkdir -p "$DX_REWORK_BUILD_ROOT"
          scripts/deploy/package-release.sh "$sha" "$BUILD_TIME" "$out"
          scripts/deploy/verify-runtime.sh "$out/api"
          scripts/deploy/create-transfer-bundle.sh "$out" "$RUNNER_TEMP/pr17-$sha.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum -c --strict "pr17-$sha.tar.gz.sha256")

      - name: Stop isolated PostgreSQL
        id: db_stop
        if: always() && env.DB_REQUIRED == 'true'
        run: docker rm -f dx-rework-full-gate-postgres >/dev/null 2>&1 || true


      - name: Record lane outcomes
        id: lane
        if: always()
        env:
          LANE_STEPS: ${{ toJSON(steps) }}
          LANE_STATUS: ${{ job.status }}
        run: node scripts/ci/full-gate-lanes.mjs record
      - name: Retain original lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-evidence-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/non-db-results.json
            ${{ runner.temp }}/postgres-execution.json
            ${{ runner.temp }}/full-lane-record.json
          if-no-files-found: error
          retention-days: 7

  full-validate:
    name: Full Gate exact Head
    needs: [prepare, non-db, postgres]
    if: ${{ always() && inputs.gate_kind == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      receipt: ${{ steps.summary.outputs.receipt }}
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      NODE_ENV: test
      GIT_SHA: ${{ inputs.head_sha }}
      SERVICE_NAME: dx-rework-api
    steps:
      - name: Checkout aggregate Head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
      - name: Set up aggregate Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify complete lane results
        id: aggregate
        env:
          FULL_GATE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/full-gate-lanes.mjs aggregate

      - name: Write actual gate summary
        id: summary
        if: always() && steps.aggregate.outcome == 'success'
        shell: bash
        env:
          GATE_KIND: full
          GATE_PHASE: final
          GATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_JOB_STATUS: ${{ job.status }}
          GATE_STEPS_JSON: ${{ steps.aggregate.outputs.steps }}
          GATE_SCOPE_JSON: ${{ steps.aggregate.outputs.scope }}
          GATE_CHECKS_JSON: >-
            [["title","Require explicit Full Gate title","always"],["checkout","Checkout exact PR Head","always"],["node","Set up Node 22","always"],["npm","Pin npm 10","always"],["head","Verify exact Head","always"],["protocol","Validate frozen request identity","always"],["reuse_select","Select successful same-Head light evidence","always"],["reuse_download","Download exact source light artifact","optional"],["reuse_restore","Verify source context and restore build outputs","optional"],["policy","Verify Actions usage policy","always"],["construction","Verify current change evidence","always"],["protocol_tests","Run CI protocol regression tests","always"],["risk","Classify Full Gate risk from exact PR diff","always"],["main_compat","Compare exact candidate with current remote main migration history","release"],["install","Install locked dependencies","always"],["runtime","Record actual toolchain and resolved test configuration","always"],["audit","Audit production dependency graph","always"],["lint","Lint","always"],["types","Typecheck","always"],["build","Build workspaces without deployment postbuild","always"],["migration_lint","Validate migration files statically","always"],["secrets","Scan repository history and first-party artifacts for secrets","always"],["db_start","Start isolated PostgreSQL only for DB-sensitive changes","db"],["db_seed","Seed database with base-revision migration history","db"],["db_migrate","Apply and validate exact Head migration history against PostgreSQL","db"],["resource_smoke","Validate database resource lifecycle before expensive suites","db"],["tests","Full unit and integration suite without runtime DB escalation","always"],["db_tests","Run mapped PostgreSQL sensitive-domain regressions","db"],["journey","Run PostgreSQL 13 Journey read compatibility","journey"],["root_audit","Run PostgreSQL Root audit control-boundary regressions for migration changes","migration"],["business_chain","Run PostgreSQL business chain for business, migration or deployment-sensitive changes","chain"],["backup","PostgreSQL backup and isolated restore drill","maintenance"],["acceptance_recovery","Acceptance low-privilege migration and backup recovery","maintenance"],["release_history","Main and existing release histories through low-privilege Acceptance maintenance","release_deployment"],["release_acceptance","PR-17 exact-head acceptance and lifecycle","activation"],["package","PR-17 package, runtime and relocation-safe transfer","transfer"],["db_stop","Stop isolated PostgreSQL","db"]]
        run: |
          node <<'GATE_SUMMARY_JS'
          const fs = require('node:fs');
          const steps = JSON.parse(process.env.GATE_STEPS_JSON || '{}');
          const checks = JSON.parse(process.env.GATE_CHECKS_JSON);
          const scope = JSON.parse(process.env.GATE_SCOPE_JSON);
          const classified = steps[process.env.GATE_KIND === 'full' ? 'risk' : 'classify']?.outcome === 'success';
