name: Acceptance isolated release

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact repository commit SHA to deploy into isolated Acceptance/UAT
        required: true
        type: string
      dry_run:
        description: Build and package only; do not connect to Acceptance ECS
        required: true
        type: boolean
        default: true
      apply_migrations:
        description: Apply pending migrations to the isolated Acceptance database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: acceptance-isolated-release
  cancel-in-progress: false

jobs:
  gate:
    name: Build exact Acceptance candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate requested SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 1

      - name: Verify exact candidate
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Pin npm 10
        run: npm install --global npm@10.9.9 --no-audit --no-fund --prefer-offline

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build Acceptance candidate
        env:
          APP_BASE_PATH: /
          VITE_BASE_PATH: /
        run: npm run build

      - name: Scan repository history and build artifacts
        run: npm run secret:scan:full

      - name: Package Acceptance candidate
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.git_sha }}
          APP_BASE_PATH: /
          VITE_BASE_PATH: /
          DX_REWORK_BUILD_ROOT: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          build_time="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p "$DX_REWORK_BUILD_ROOT"
          scripts/deploy/package-release.sh "$TARGET_SHA" "$build_time" "$DX_REWORK_BUILD_ROOT/$TARGET_SHA"
          scripts/deploy/verify-runtime.sh "$DX_REWORK_BUILD_ROOT/$TARGET_SHA/api"
          scripts/deploy/create-transfer-bundle.sh             "$DX_REWORK_BUILD_ROOT/$TARGET_SHA"             "$RUNNER_TEMP/acceptance-$TARGET_SHA.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum -c --strict "acceptance-$TARGET_SHA.tar.gz.sha256")

      - name: Upload checksum-bound Acceptance bundle
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-transfer-${{ inputs.git_sha }}
          path: |
            ${{ runner.temp }}/acceptance-${{ inputs.git_sha }}.tar.gz
            ${{ runner.temp }}/acceptance-${{ inputs.git_sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy isolated Acceptance/UAT
    needs: gate
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dx-rework-acceptance
    steps:
      - name: Checkout deployment transport script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 1

      - name: Download verified Acceptance bundle
        uses: actions/download-artifact@v4
        with:
          name: acceptance-transfer-${{ inputs.git_sha }}
          path: transfer

      - name: Verify and transfer Acceptance release
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DX_REWORK_SSH_HOST }}
          SSH_USER: ${{ secrets.DX_REWORK_SSH_USER }}
          SSH_KEY: ${{ secrets.DX_REWORK_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DX_REWORK_SSH_HOST_KEY }}
          ACCEPTANCE_PUBLIC_URL: ${{ secrets.DX_REWORK_ACCEPTANCE_PUBLIC_URL }}
          TARGET_SHA: ${{ inputs.git_sha }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$SSH_HOST_KEY"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTANCE_PUBLIC_URL" == https://* ]]
          [[ "$ACCEPTANCE_PUBLIC_URL" != https://dxerp.org.cn* ]]

          cd transfer
          sha256sum -c --strict "acceptance-$TARGET_SHA.tar.gz.sha256"
          cd ..

          install -m 0700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

          root=/opt/dx-rework-acceptance
          incoming="$root/incoming/${GITHUB_RUN_ID}-$TARGET_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST"             'bash -s --' prepare "$incoming"             < scripts/deploy/acceptance-remote-release.sh
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes             "transfer/acceptance-$TARGET_SHA.tar.gz"             "$SSH_USER@$SSH_HOST:$incoming/transfer.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST"             'bash -s --' apply "$incoming" "$TARGET_SHA" "$APPLY_MIGRATIONS" "$GITHUB_RUN_ID"             < scripts/deploy/acceptance-remote-release.sh

          curl -fsS "${ACCEPTANCE_PUBLIC_URL%/}/health/ready" >/dev/null
          curl -fsS "${ACCEPTANCE_PUBLIC_URL%/}/version" | grep -F "$TARGET_SHA" >/dev/null
          curl -fsS "${ACCEPTANCE_PUBLIC_URL%/}/ui/acceptance-lab" | grep -qi '<html'
