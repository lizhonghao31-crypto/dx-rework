name: PR-13 native upload

on:
  push:
    branches: [codex/pr-13-todo-notification]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f667b409f672606a8a6b878f3cd0219e04931419
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pr13-final-staging
          git show origin/pr13-final-staging:.github/workflows/pr13-second-review-commit.yml \
            | sed -n "/cat > \/tmp\/pr13.patch.b64 <<'PATCH'/,/^          PATCH$/p" \
            | sed '1d;$d;s/^          //' > /tmp/pr13.patch.b64
          test -s /tmp/pr13.patch.b64
          base64 --decode /tmp/pr13.patch.b64 > /tmp/pr13.patch
          git apply --index /tmp/pr13.patch
          git diff --cached --check
      - name: Validate
        run: |
          npm ci
          npm run typecheck --workspace @dx-rework/api --if-present
          npm run db:migrate:lint
          npx vitest run tests/unit/todo-second-review-closure.test.ts
      - name: Publish clean commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(pr-13): close second permission review findings"
          git push --force origin HEAD:refs/heads/pr13-native-output
