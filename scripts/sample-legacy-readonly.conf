# Include in the existing legacy host's server block during the cutover window.
# Preserve reads and POST /sample/api/media/sign (a read-only signed-download endpoint).
location = /sample/api/cloud-db/save { return 503 "Sample migration: read only\n"; }
location = /sample/api/cloud-db/migrate-local { return 503 "Sample migration: read only\n"; }
location = /sample/api/cloud-db/mutate { return 503 "Sample migration: read only\n"; }
location = /sample/api/media/upload { return 503 "Sample migration: read only\n"; }
location ^~ /sample/api/qr-session { return 410 "Legacy handoff is retired\n"; }
