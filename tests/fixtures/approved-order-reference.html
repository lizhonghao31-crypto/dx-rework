[data-dx-ui="governed"] .dx-workflow-rail > :is(a, div)::before { content: ""; position: absolute; top: 11px; left: 0; right: 0; height: 2px; background: #d8e2ef; }

[data-dx-ui="governed"] .dx-facts-table-scroll { max-width: 100%; min-width: 0; }

[data-dx-ui="governed"] .dx-facts-table caption { padding: 0 0 10px; text-align: left; font-size: 16px; font-weight: 700; }
[data-dx-ui="governed"] .dx-facts-table :is(th, td) { padding: 10px 8px; border-bottom: 1px solid var(--dx-governed-border); vertical-align: top; overflow-wrap: anywhere; }
[data-dx-ui="governed"] .dx-facts-table :is(th, td):first-child { width: 20%; text-align: left; }
[data-dx-ui="governed"] .dx-facts-table :is(th, td):nth-child(2) { text-align: left; }
[data-dx-ui="governed"] .dx-facts-table :is(thead, tfoot) { background: #f0f5fa; }
[data-dx-ui="governed"] .dx-facts-table tfoot { font-weight: 700; }
[data-dx-ui="governed"] .dx-responsive-facts small { display: block; color: var(--dx-governed-muted); }
[data-dx-ui="governed"] .dx-facts-cards { display: none; }
[data-dx-ui="governed"] :is(.dx-workflow-rail a, .dx-disclosure > summary):focus-visible { outline: 3px solid var(--dx-v2-color-focus); outline-offset: -3px; }
[data-dx-ui="governed"] .dx-facts-empty { padding: 12px; color: var(--dx-governed-muted); }
@media (max-width: 800px) {
  [data-dx-ui="governed"] .dx-key-facts { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 14px; }
  [data-dx-ui="governed"] .dx-key-facts > div { padding: 0; border: 0; }
  [data-dx-ui="governed"] .dx-key-facts > div:first-child { grid-column: 1 / -1; padding-bottom: 12px; border-bottom: 1px solid var(--dx-governed-border); }
  [data-dx-ui="governed"] .dx-key-facts dd { font-size: 14px; }

  [data-dx-ui="governed"] .dx-facts-card dt { font-size: 11px; color: var(--dx-governed-muted); }
  [data-dx-ui="governed"] .dx-facts-card dd { margin: 4px 0 0; font-size: 13px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  [data-dx-ui="governed"] .dx-facts-card__heading { grid-column: 1 / -1; }
  [data-dx-ui="governed"] .dx-facts-card__heading dt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

[data-dx-ui="governed"] .dx-decision-summary__icon { width: 28px; height: 32px; color: var(--dx-v2-color-primary); }

/* Opt-in compact cards: headings stay readable; whole metrics wrap as units. */
@media (max-width: 800px) {

#dxerp {
  color-scheme: light dark;
  --dx-v2-color-bg-canvas: light-dark(#e8edf2, #131c26);
  --dx-v2-color-control: #131c26;
  --dx-v2-color-control-hover: #202b36;
  --dx-v2-color-primary: #2f6bff;
  --dx-v2-color-primary-hover: #245fe9;
  --dx-v2-color-primary-pressed: #1c4dcc;
  --dx-v2-color-text: light-dark(#131c26, #f2f5f8);
  --dx-v2-color-text-secondary: light-dark(#526371, #b8c6d2);
  --dx-v2-color-surface: light-dark(#f2f5f8, #202b36);
  --dx-v2-color-inset: light-dark(#d8e0e8, #293949);
  --dx-form-control-border: light-dark(#c9ced6, #526371);
  --dx-form-control-background: light-dark(#fff, #202b36);
  --dx-governed-surface: var(--dx-form-control-background);
  --dx-governed-border: var(--dx-form-control-border);
  --dx-governed-muted: var(--dx-v2-color-text-secondary);
  --p-paper: var(--dx-form-control-background);
  --p-soft: var(--dx-v2-color-surface);
  --p-line: var(--dx-form-control-border);
  --p-blue-soft: light-dark(#dbe6ff, #203a70);
  --p-success-bg: light-dark(#dcf7ed, #163c35);
  --p-success-text: light-dark(#087f61, #87e0bf);
  --p-danger-bg: light-dark(#ffe0e0, #4d2930);
  --p-danger-text: light-dark(#c52e3d, #ffadb5);
  --p-warning-bg: light-dark(#fff0cc, #463b21);
  --p-warning-text: light-dark(#8b5100, #ffcf75);
  width: 100%;
  color: var(--dx-v2-color-text);
  font: var(--dx-body-font-size)/var(--dx-body-line-height) var(--dx-v2-font-family);
}
#dxerp *, #dxerp *::before, #dxerp *::after { box-sizing: border-box; }
#dxerp [hidden] { display: none !important; }
#dxerp button, #dxerp input, #dxerp select, #dxerp textarea { font: inherit; }
#dxerp :is(button, summary, select, a) { cursor: pointer; }

#dxerp button, #dxerp a { -webkit-tap-highlight-color: transparent; }

#dxerp h1, #dxerp h2, #dxerp h3, #dxerp p { margin: 0; }
#dxerp h1 { font-size: 19px; line-height: 1.45; font-weight: 700; }
#dxerp h2 { font-size: 15px; line-height: 1.5; font-weight: 700; }
#dxerp h3 { font-size: 13px; line-height: 1.5; font-weight: 700; }
#dxerp .p-demo-shell { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 20px; margin-bottom: 12px; padding: 10px 16px; background: var(--p-soft); border-radius: var(--dx-v2-radius-md); }
#dxerp .p-demo-label, #dxerp .p-demo-controls, #dxerp .p-demo-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
#dxerp .p-demo-label { justify-content: flex-start; }

#dxerp .p-demo-controls label { display: flex; align-items: center; gap: 8px; }

#dxerp .p-demo-controls fieldset { display: flex; flex-wrap: wrap; gap: 4px; border: 0; padding: 0; margin: 0; min-width: 0; align-items: center; }

    render();
  });
  stateButtons.forEach(btn => btn.addEventListener('click', () => setState(btn.dataset.state)));
  root.addEventListener('input', event => {
    if (event.target.id === 'p-task-note') model.taskNote = event.target.value;
    if (event.target.id === 'p-correction-reason') { model.recoveryReason = event.target.value; model.validation = false; }
    if (event.target.id === 'p-send-date') model.sendDate = event.target.value;
    if (event.target.id === 'p-delivery-date') model.deliveryDate = event.target.value;
  });
  root.addEventListener('click', event => {
    const tab = event.target.closest('[data-tab]');
    if (tab) { model.taskTab = tab.dataset.tab; render(); const newTab = root.querySelector(`[data-tab="${model.taskTab}"]`); if (newTab) newTab.focus(); return; }
    const control = event.target.closest('[data-action]');
    if (!control) return;
    const action = control.dataset.action;
    if (action.startsWith('preview-')) { preview(Number(action.slice(8))); return; }
    if (action === 'dialog-close') { closeDialog(); return; }
    if (action === 'source-list') { model.sourceList = true; render(); announce('已返回原筛选与页码'); return; }
    if (action === 'open-original') { showObject(1); return; }
    if (action === 'open-next') { showObject(2); announce('已进入下一张模拟单'); return; }
    if (action === 'task-documents') { model.taskTab = '本单资料'; render(); return; }
    if (action === 'task-handle') { model.taskTab = '当前办理'; render(); return; }
    if (action === 'approve') { model.state = 'complete'; model.returnToManagement = false; render(); announce('模拟方案已批准'); return; }
    if (action === 'reject-management') { model.state = 'complete'; model.returnToManagement = true; render(); announce('模拟方案已退回生产管理'); return; }
    if (action === 'complete-pattern') { model.state = 'complete'; render(); announce('模拟纸样任务已完成'); return; }
    if (action === 'edit-correction') { rememberObject(); const original = {...mockObjects[model.scene][model.orderNo]}; const linkedOrder = model.scene === 'order' || model.linkedOrder; model.scene = 'recovery'; Object.assign(mockObjects.recovery[model.orderNo], original); Object.assign(model, original); model.state = 'normal'; model.phase = 'correction'; model.linkedOrder = linkedOrder; model.editing = true; model.sourceList = false; render(); root.querySelector('#p-correction-reason').focus(); return; }
    if (action === 'recover-attempt') { model.state = 'complete'; model.phase = 'awaiting-ie'; model.editing = false; render(); announce('模拟核对确认原请求已提交'); return; }
    if (action === 'submit-correction') {
      if (!model.recoveryReason.trim()) { model.validation = true; render(); root.querySelector('#p-correction-reason').focus(); announce('请填写修改说明'); return; }
      if (!model.sendDate || !model.deliveryDate || model.sendDate > model.deliveryDate) {
        showDialog(`<h2 id="p-dialog-heading">请先完善以下资料</h2><p>预计裁片发出日期不得晚于要求交货日期。</p><div class="p-dialog-actions">${button('去修改','dialog-close',true)}</div>`); return;
      }
      model.state = 'complete'; model.phase = 'awaiting-ie'; model.editing = false; render(); announce('模拟修改资料已提交，等待IE报价'); return;
    }
    if (action === 'return-order') {
      showDialog(`<h2 id="p-dialog-heading">退回跟单修改</h2><form id="p-return-form"><label class="p-form-field"><span>退回原因（必填）</span><textarea id="p-return-reason" required maxlength="500">${esc(model.returnedReason)}</textarea></label><div class="p-dialog-actions">${button('取消','dialog-close')}<button type="submit" class="dx-button dx-button--primary">确认退回</button></div></form>`); return;
    }
  });
  root.addEventListener('submit', event => {
    event.preventDefault();
    if (event.target.id === 'p-return-form') {
      const reason = root.querySelector('#p-return-reason').value.trim();
      if (!reason) return;
      model.returnedReason = reason; closeDialog(); model.state = 'returned'; model.editing = false; render(); announce('模拟订单已退回原跟单');
    }
  });
  render();
})();

</script>

</body></html>
